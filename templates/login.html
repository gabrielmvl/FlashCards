<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://cdn.boxicons.com/3.0.6/fonts/basic/boxicons.min.css' rel='stylesheet'>
    <link href='https://cdn.boxicons.com/3.0.6/fonts/brands/boxicons-brands.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="static/Styles/login_style.css">
    <title>BetterStudy - Login</title>
</head>
<body>
    <main class="container">
        <form action="" method="post">
            <h1>BetterStudy Login</h1>
            {% if NotUser %}
                <div class="warning"> 
                    <p>Credenciais inválidas!<br><a href="{{ url_for('Cadastro') }}"> Cadastre-se</a> ou tente novamente.</p>
                </div>
            {% else %}
                <div class="MensagemInicial">
                    <p>Sentimos a sua falta!<br>Insira seus dados para entrar:</p>
                </div>
            {% endif %}
            <div class="input-box">
                <input placeholder="Email ou nome de usuario" type="text" name="MainForm" value="{{MainSub}}" id="">
                <i class="bx bxs-user"></i>
            </div>
            <div class="input-box">
                <input placeholder="Senha" type="password" name="SenhaForm" id="Senha">
                <button type="button" onclick="MostrarOcultar()"><i class='bxr bxs-eye' id="Olho"></i></button>
                <script>
                    function MostrarOcultar() {
                        const Olho = document.getElementById('Olho')
                        const Senha = document.getElementById('Senha')
                        if (Olho.className === 'bxr bxs-eye') {
                            Olho.className = 'bxr bxs-eye-slash'
                            Senha.type = 'text'
                        } else {
                            Olho.className = 'bxr bxs-eye'
                            Senha.type = 'password'
                        }
                    }
                </script>
            </div>
            <div class="passwd-forgot">
                <label>
                <input type="checkbox" name="RememberLoginForm">
                Lembrar login
                </label>
                <a href="#">Esqueceu a senha?</a>
            </div>
            <button type="submit" class="entrar">Entrar</button>
            <div class="register-link">
                <p>Não tem uma conta? <a href="{{ url_for('Cadastro') }}">Cadastre-se</a></p>
            </div>
        </form>
    </main>
</body>
</html>
